#!name=Apple WLOC 定位修改（合体版）
#!desc=定位改写 + 旧域名迁移 二合一 | 选点页 https://wloc.bybot.si/
#!author=Yu9191 Rewrite / local
#!homepage=https://wloc.bybot.si/

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://wloc.bybot.si/dist/wloc.js
^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save url script-echo-response https://wloc.bybot.si/dist/wloc-settings.js
^https?:\/\/wloc-spoofer\.wloc\.workers\.dev\/(.*) url 302 https://wloc.bybot.si/$1

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com, wloc-spoofer.wloc.workers.dev
